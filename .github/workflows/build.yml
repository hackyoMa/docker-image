name: node

permissions:
  contents: read

on:
  push:
    branches:
      - 'node'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24"
            node_version: "24.22.2"

          - version: "26"
            node_version: "26.13.0"

    uses: docker/github-builder/.github/workflows/build.yml@v1

    permissions:
      contents: read
      id-token: write

    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: node-${{ matrix.version }}
      meta-images: hackyo/node
      meta-tags: |
        type=raw,value=${{ matrix.version }}
      meta-labels: |
        com.github.hackyoMa=20261110
      set-meta-labels: true
      set-meta-annotations: true
      registry-login: true
      sbom: true
      build-args: |
        NODE_VERSION=${{ matrix.node_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
