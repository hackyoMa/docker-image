name: frp

permissions:
  contents: read

on:
  push:
    branches:
      - 'frp'

jobs:
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1

    permissions:
      contents: read
      id-token: write

    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: frp-0
      meta-images: hackyo/frp
      meta-tags: |
        type=raw,value=0
      meta-labels: |
        com.github.hackyoMa=20261110
      set-meta-labels: true
      set-meta-annotations: true
      registry-login: true
      sbom: true
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
