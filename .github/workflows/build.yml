name: jdk

on:
  push:
    branches:
      - jdk

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "8"
            java_version: "8.0.512"
            zulu_version: "8.98.0.111"

          - version: "11"
            java_version: "11.0.33"
            zulu_version: "11.92.113"

          - version: "17"
            java_version: "17.0.21.0.3"
            zulu_version: "17.70.113"

          - version: "21"
            java_version: "21.0.13.0.3"
            zulu_version: "21.54.109"

          - version: "25"
            java_version: "25.0.5.0.3"
            zulu_version: "25.38.109"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hackyo/jdk
          tags: |
            type=raw,value=${{ matrix.version }}
          labels: |
            com.github.hackyoMa=20261110

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ matrix.version }}
            JAVA_VERSION=${{ matrix.java_version }}
            ZULU_VERSION=${{ matrix.zulu_version }}
          provenance: mode=max
          sbom: true
