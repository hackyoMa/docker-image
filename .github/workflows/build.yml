name: maven

permissions:
  contents: read

on:
  push:
    branches:
      - 'maven'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - java_version: "8"

          - java_version: "11"

          - java_version: "17"

          - java_version: "21"

          - java_version: "25"

    uses: docker/github-builder/.github/workflows/build.yml@v1

    permissions:
      contents: read
      id-token: write

    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: maven-3.10-jdk-${{ matrix.java_version }}
      meta-images: hackyo/maven
      meta-tags: |
        type=raw,value=3.10-jdk-${{ matrix.java_version }}
      meta-labels: |
        com.github.hackyoMa=20261110
      set-meta-labels: true
      set-meta-annotations: true
      sbom: true
      build-args: |
        JAVA_VERSION=${{ matrix.java_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
