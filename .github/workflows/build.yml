name: jre

permissions:
  contents: read

on:
  push:
    branches:
      - 'jre'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "8"
            java_version: "8.0.512"
            zulu_version: "8.98.0.111"

          - version: "11"
            java_version: "11.0.33"
            zulu_version: "11.92.113"

          - version: "17"
            java_version: "17.0.21.0.3"
            zulu_version: "17.70.113"

          - version: "21"
            java_version: "21.0.13.0.3"
            zulu_version: "21.54.109"

          - version: "25"
            java_version: "25.0.5.0.3"
            zulu_version: "25.38.109"

    uses: docker/github-builder/.github/workflows/build.yml@v1

    permissions:
      contents: read
      id-token: write

    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-scope: jre-${{ matrix.version }}
      meta-images: hackyo/jre
      meta-tags: |
        type=raw,value=${{ matrix.version }}
      meta-labels: |
        com.github.hackyoMa=20261110
      set-meta-labels: true
      set-meta-annotations: true
      sbom: true
      build-args: |
        VERSION=${{ matrix.version }}
        JAVA_VERSION=${{ matrix.java_version }}
        ZULU_VERSION=${{ matrix.zulu_version }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
